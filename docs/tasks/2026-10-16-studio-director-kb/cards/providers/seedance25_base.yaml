# 导演知识库 · 模型能力卡
schema: kb.provider/v1
id: provider.seedance25_base
title: Seedance 2.5 · 通用
version: 1
status: draft
updated: 2026-10-16
provider: seedance25
style: base
tested: tested
summary: >-
  动作戏和动漫人物戏的主力。响应整数秒时间戳（与 2.0 相反），动作宜概括描述、只细写少数记忆点。
  按 token 计费，480p 按 MCP 估价约是万相 480P 的 3–4 倍；本机 MCP 不支持参考音频、编辑和延长。
model_ids: [doubao-seedance-2-5-260628]
capabilities:
  input_modes: [文生视频, 首帧生视频, 首尾帧生视频, 参考图生视频]
  duration_s: [4, 30]
  resolutions: [480p, 720p, 1080p]
  ratios: [adaptive, '21:9', '16:9', '4:3', '1:1', '3:4', '9:16']
  native_audio: true
  reference_audio: false
  last_frame: true
  max_reference_images: 30
  unsupported: [参考视频, 参考音频, 视频编辑, 视频延长, 4K]
pricing_note: >-
  按 token 计费（约 ¥0.07/千 tokens）。实测：1080p 约 48.9k tokens/秒，约 ¥3.43/秒（侠客行）；
  720p 有声约 21.6k tokens/秒，约 ¥1.5/秒（《我命由我不由天》）。MCP 对 480p 估 ¥0.92–1.16/秒（按面积外推）。
  以 usage.completion_tokens 对账。
prompt_syntax:
  structure: 素材指代（编号与用途）→ 一句话概述 → 按时间戳或「镜头 N」分段写内容 → 结尾补充贯穿始终的机位、环境、声音
  timestamps:
    supported: true
    format: 整数秒；区间要连续，如「0-3秒……3-7秒……」或「[1s-4s]」；也支持时间点「第5秒」和相对时间「3秒后」
    note: 与 2.0 相反：2.5 响应整数秒时间戳。段内内容太少会自由发挥，太多会过度剪切或遗漏；不用时间戳控制频次。
  shot_labels: 「镜头 N」同样可用
  dialogue: 「角色台词（情绪）：内容」；不要在台词后复述词语再加语气描述，会诱发字幕
  negatives: 支持负向控制字幕和音频（「不要字幕」「无 bgm，只生成环境音和动作音」）；其余尽量正向描述
  symbols: 素材按上传顺序编号「图 1 / 视频 1 / 音频 1」，每个素材在文字里写清用途
pipeline_overrides:
  - rule: gen.audio 默认 false；打斗这类拟音与动作天然同步的场景可以开，并在 sound_plan.clip_audio 写明取用、降噪和避让
    why: 02 规定；侠客行开原生拟音的效果好
    src: [src.user_02, src.xiakexing_files]
  - rule: camera_fixed 参数当前不发送，固定机位写进提示词
    why: 05 规定 camera_fixed 只保留为意图字段
    src: [src.user_05]
  - rule: 首帧模式下画幅自动是 adaptive，首帧的画幅就是成片画幅
    why: 官方锁定规则；MCP 也会改成 adaptive
    src: [src.sd25_guide, src.mcp_models]
limits:
  prompt_max_chars: 2000
  reference_subjects_stable: 主体图 1–8 个效果较好，9–12 个可以试但要抽卡
  cast_stable_max: null
  concurrent_tasks: null
rules:
  - id: M1
    rule: 时间戳写整数秒，区间连续，不跳段
    why: 官方规则
    neg_refs: [neg.frequency_timestamp]
    src: [src.sd25_guide]
  - id: M2
    rule: 通用的景别、运镜词直接写；生僻术语写成「名词 + 描述」；不裸写 Dolly、Crane、Aerial
    why: 官方建议；裸写的英文术语可能被误判为专名（seedance-shot-design 的失败诊断）
    neg_refs: [neg.bare_english_camera_term]
    src: [src.sd25_guide, src.sds, src.user_02]
  - id: M3
    rule: 动作优先概括描述（「双方展开近身搏斗」），只在少数有记忆点的动作上写细节
    why: 官方建议；这也是打斗卡「动作单元」计数口径的依据
    neg_refs: [neg.too_many_actions]
    src: [src.sd25_guide]
  - id: M4
    rule: 字幕：写「不要字幕」；台词不在 video_prompt 里复述；参考素材本身不能带字幕
    why: 官方 FAQ：台词后复述加语气会诱发字幕，参考视频带字幕会被跟随
    neg_refs: [neg.dialogue_text_in_video_prompt]
    src: [src.sd25_guide]
  - id: M5
    rule: 开原生音频又不要配乐时，把音乐类同义词一次写全，并在提示词开头和结尾各写一遍
    why: 官方 FAQ：只写一次「禁止背景音乐」，特效音仍可能被生成成配乐
    neg_refs: [neg.music_leaks_native_audio]
    src: [src.sd25_guide]
  - id: M6
    rule: 不写过强的情绪词；必要时写「正常人眼、不发光」
    why: 官方 FAQ：情绪过度响应会让瞳孔发光
    neg_refs: [neg.emotion_glow_eyes]
    src: [src.sd25_guide]
  - id: M7
    rule: 参考图分辨率不要超过输出分辨率
    why: 官方 FAQ：高分辨率参考图在草地、树叶这类密集纹理处可能出现指纹状纹理，1080p 输出时概率低于 720p
    src: [src.sd25_guide]
  - id: M8
    rule: 多人镜按人物首次出场的顺序上传参考素材，编号和提示词一一对应
    why: 官方 FAQ：顺序不对会让先出场的人被换成别的参考角色
    src: [src.sd25_guide]
  - id: M9
    rule: 复杂任务拆成几个简单任务分别生成，再剪辑整合
    why: 官方 FAQ：一次承担多项要求时效果不稳定
    neg_refs: [neg.stacked_camera_moves]
    src: [src.sd25_guide]
  - id: M10
    rule: 涉及人物露脸或近似 IP 的镜头，量产前先跑一条 5 秒探针
    why: 肖像闸在提交时拦（不计费），版权检测在生成完才拦（不计费但白等约 6 分钟）
    neg_refs: [neg.realistic_face_on_seedance, neg.ip_lookalike_design]
    src: [src.mem_xiakexing, src.mem_copyright]
  - id: M11
    rule: 2.5 和 2.0 的美学偏好差异大，同一场里不要混用两个版本的片段
    why: 官方 FAQ：同参考图同提示词，两版风格明显不同
    src: [src.sd25_guide]
sources: [src.sd25_guide, src.mcp_models, src.user_02, src.user_05, src.xiakexing_files, src.mem_xiakexing, src.mem_copyright, src.sds]
