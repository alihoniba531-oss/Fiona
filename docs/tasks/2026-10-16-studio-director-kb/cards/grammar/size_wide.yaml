# 导演知识库 · 镜头语法卡
schema: kb.grammar/v1
id: grammar.size_wide
title: 远景
version: 1
status: draft
updated: 2026-10-16
family: shot_size
order: 2
aliases: [wide shot, long shot, WS, LS]
summary: 人物约占画高 1/4 到 1/3，看得清肢体动作、看不清表情；交代人与环境、动作路线。
definition: 人物与环境同时可读：能看清人物做什么，看不清脸上的表情。
framing: 人物约占画高 1/4–1/3，头脚都在画内，周围留有大量环境
mouth_readable: none
narrative_use:
  - 交代人物和环境的关系、走位路线
  - 追逐、打斗回合的全貌
  - 群像站位
prompt:
  write:
    - 远景，人物约占画高 1/4，能看清动作，周围是 [环境]
  avoid:
    - 只写「远处」不写人物比例，模型会在全景和大远景之间随机
provider_notes:
  - providers: [seedance25]
    realism: [realistic]
    note: 人物不超过画高 1/4 的远景小背影能过肖像闸与版权检测（侠客行、《战》实测）
    src: [src.mem_xiakexing, src.mem_copyright]
see_refs: [grammar.size_extreme_wide, grammar.size_full]
sources: [src.film_grammar, src.sds, src.wan_t2v_guide, src.mem_xiakexing, src.mem_copyright]
