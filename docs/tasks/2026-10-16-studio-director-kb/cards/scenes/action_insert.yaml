# 导演知识库 · 场景模板卡
schema: kb.scene/v1
id: scene.action_insert
title: 动作特写
version: 1
status: draft
updated: 2026-10-16
definition: 以一个关键物理动作或道具、机构操作为信息核心，靠放大细节讲清「发生了什么」。
summary: >-
  一镜一个因果：准备 → 接触或施力 → 反应 → 恢复。材质、数量、零件关系写死，机位固定。
  先给位置再给细节；精确的数字、刻度、文字一律后期。P01 的三次返工都出在这一类镜头上。
tags:
  pace: [medium, slow, fast]
  emotion: [calm, tense, awe, mystery]
  cast: [none, solo, duo]
  realism: [realistic, anime, 3d]
  setting: [interior, exterior]
signals:
  strong:
    - 手部或道具的动作就是信息核心（开锁、递信、扣扳机、拧紧螺丝）
    - 机构原理演示（P01 丝杠、P02 螺丝）
  weak:
    - 「缓缓 / 轻轻 / 拧 / 按 / 抽出」
  counter:
    - signal: 旁白讲解为主，画面只是证据
      route_to_ref: scene.explainer
    - signal: 这个动作是打斗里的一招
      route_to_ref: scene.fight
directing:
  - rule: 一镜一个因果，按「准备 → 接触或施力 → 反应 → 恢复」写可见动作（02 规定）。
    src: [src.user_02]
  - rule: 材质、数量、零件关系写死：「银灰色金属螺旋切屑、量少」「丝杠和每根滚柱始终是彼此分开的独立零件」。
    see_refs: [neg.camera_move_rewrites_material, neg.orbit_structure_interpenetration]
    src: [src.p01_audit]
  - rule: 先给位置再给细节。先一个能看出零件在整体里位置的近景，再进大特写，观众才知道看的是什么。
  - rule: 手是最好的尺度参照，但手指结构风险高：戴手套、只露两三根手指、动作慢。
    src: [src.p01_audit]
  - rule: 质检不只看结构，还要核对材质与物理常识（金属屑不能像木屑，滚柱要和丝杠平行）。
    src: [src.mem_preloq]
beats:
  - id: B1
    name: 定位
    purpose: 这东西在哪、是什么
    share: [0.15, 0.30]
  - id: B2
    name: 动作
    purpose: 因果过程
    share: [0.40, 0.60]
  - id: B3
    name: 结果
    purpose: 变化之后的状态
    share: [0.15, 0.30]
coverage:
  - id: C1
    beat: B1
    shot: 近景或中景，看出零件或道具在整体里的位置
    size_refs: [grammar.size_close, grammar.size_medium]
    angle_ref: grammar.angle_eye_level
    camera_ref: grammar.move_static
    purpose: 定位
  - id: C2
    beat: B2
    shot: 大特写或微距，拍动作过程
    size_refs: [grammar.size_extreme_closeup]
    camera_ref: grammar.move_static
    purpose: 因果过程本身
  - id: C3
    beat: B2
    shot: 第二个角度的大特写（侧面或俯视）
    size_refs: [grammar.size_extreme_closeup]
    angle_ref: grammar.pos_profile
    camera_ref: grammar.move_static
    purpose: 补充看不清的一面；代替环绕
    optional: true
  - id: C4
    beat: B3
    shot: 结果的大特写，或回到近景
    size_refs: [grammar.size_extreme_closeup, grammar.size_close]
    camera_ref: grammar.move_static
    purpose: 变化之后的状态
  - id: C5
    beat: B3
    shot: 后期分屏对比（P01 S06 上下分屏）
    size_refs: [grammar.size_extreme_closeup]
    camera_ref: grammar.move_static
    purpose: 两种结构并排比较；post_only
    optional: true
pacing:
  basis: 中、慢档依据 P01 实测（S04 3.54 秒、S09 2.96 秒、S05 6.0 秒）；快档是经验值。
  src: [src.p01_audit]
  tiers:
    fast:
      shot_len_s: [1.5, 2.5]
      shots_per_min: [24, 40]
      gen_ratio: [1.6, 2.4]
      use_when: 动作片里的快速插入
    medium:
      shot_len_s: [2.5, 4.0]
      shots_per_min: [15, 24]
      gen_ratio: [1.15, 1.5]
      use_when: 常规的道具或机构动作
    slow:
      shot_len_s: [4.0, 6.5]
      shots_per_min: [9, 15]
      gen_ratio: [1.05, 1.3]
      use_when: 复杂机构的完整运动（P01 S05）
generation:
  min_gen_s: 4
  strategy: per_shot
  rules:
    - 一律固定机位；开头裁 0.3 秒左右（P01 实测）。
    - P0 级结构镜先跑一条探针，确认结构不穿插再量产（P01 S05 的做法）。
    - 机构运动写清物理关系：自转加公转、始终平行、啮合位置。
    - 精确刻度、数字、标签不靠生成，后期加角标。
  src: [src.p01_audit, src.user_02]
camera:
  default_refs: [grammar.move_static]
  allowed: []
  nonsensitive_only:
    - ref: grammar.move_push_in
      condition: >-
        只用在结构简单、材质不敏感的对象上。P01 S04、S09 推近微距成片保留了，
        但按统一口径，结构敏感镜头仍默认固定机位。
  avoid:
    - what: 环绕机构
      reason: P01 S05 探针里环绕让丝杠「长进」了滚柱
      neg_refs: [neg.orbit_structure_interpenetration]
    - what: 下移、升降露出新的区域
      reason: P01 S11 下移后金属切屑变成了木刨花
      neg_refs: [neg.camera_move_rewrites_material]
sound:
  items:
    - 机构声写具体：钢珠滚动的细碎声、啮合的低沉声、伺服电机的低频嗡鸣。
    - 每个接触点一个 hard 同步点。
    - 用静默衬托微小的声音；P01 每条都写「声音只要机械音效，无人声、无音乐」。
  src: [src.p01_audit, src.user_05]
ai_risks:
  - id: R1
    risk: 零件互相穿插、结构被改写
    applies_to: {}
    symptom: 丝杠穿进滚柱、齿轮融在一起
    mitigation: 固定机位；把「彼此分开的独立零件」写死
    fallback: 机构静止，只做极小的局部运动；再不行用静帧做 still_motion
    severity: P0
    neg_refs: [neg.orbit_structure_interpenetration]
    src: [src.p01_audit]
  - id: R2
    risk: 材质被改写
    applies_to: {}
    symptom: 金属切屑变成木刨花，钢件变成塑料
    mitigation: 材质、颜色、数量写死；质检核对物理常识
    fallback: 固定机位重出
    severity: P1
    neg_refs: [neg.camera_move_rewrites_material]
    src: [src.p01_audit, src.mem_preloq]
  - id: R3
    risk: 手指畸形
    applies_to: {}
    symptom: 多指、手指穿进零件
    mitigation: 戴手套，只露两三根手指，动作慢
    fallback: 去掉手，只拍零件
    severity: P1
    src: [src.p01_audit]
  - id: R4
    risk: 机构运动违反物理
    applies_to: {}
    symptom: 滚柱不平行、反向转动、不啮合
    mitigation: 写清运动关系（P01 S05 的写法）
    fallback: 机构静止
    severity: P1
    src: [src.p01_audit]
  - id: R5
    risk: 刻度、数字、标签变成乱码
    applies_to: {}
    symptom: 表盘数字错乱、零件上的字缺笔画
    mitigation: 首帧不放可读文字；需要的数字后期加角标
    fallback: 后期遮挡
    severity: P1
    neg_refs: [neg.text_in_generated_frame]
example:
  title: P01 丝杠三镜
  setup: 写实、无人物（S09 只有一只手）、中到慢档；万相 3.0、1080P、9:16。取自 P01 成片。
  gens:
    - id: G1
      duration_s: 4
      coverage_ref: scene.action_insert#C2
      angle: 微距特写，缓慢推近（成片保留）
      action: 丝杠缓慢旋转，钢珠沿螺旋滚道滚动，经返回通道循环
    - id: G2
      duration_s: 7
      coverage_ref: scene.action_insert#C2
      angle: 微距特写，固定（探针版环绕已作废）
      video_prompt: >-
        镜头固定不动。丝杠缓慢旋转，带螺纹的滚柱在原位自转并绕丝杠缓慢公转，滚柱始终与丝杠平行，两端直齿与齿圈啮合；
        丝杠和每根滚柱始终是彼此分开的独立零件，互不穿插。只有低沉的啮合声。声音只要机械音效，无人声、无音乐。画面中无任何文字、字幕、水印。
    - id: G3
      duration_s: 4
      coverage_ref: scene.action_insert#C4
      angle: 微距特写，缓慢推近表盘
      action: 有人轻推丝杠，千分表指针轻微摆动后回位
  shots:
    - {id: E1, beat: B2, from: G1, in_s: 0.3, len_s: 3.542}
    - {id: E2, beat: B2, from: G2, in_s: 0.3, len_s: 6.0}
    - {id: E3, beat: B3, from: G3, in_s: 0.3, len_s: 2.958}
  totals: 3 镜共 12.5 秒，约 14.4 镜/分；生成 3 条共 15 秒，gen_ratio 1.2；万相 1080P 约 ¥18。
sources: [src.user_02, src.user_05, src.p01_audit, src.mem_preloq, src.sds, src.film_grammar]
