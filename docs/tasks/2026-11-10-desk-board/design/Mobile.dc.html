<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>案头 · 手机半屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E8EEEA}
a{color:#56635E;text-decoration:none}a:hover{color:#1F2926}
button{font:inherit;cursor:pointer}
textarea{font:inherit}
.num{font-variant-numeric:tabular-nums}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid #A8322A;color:#A8322A;font-size:11px;line-height:1;border-radius:2px;flex:none}
.quiet{background:transparent;border:1px solid rgba(31,41,38,0.26);color:#56635E;border-radius:8px}
.ink{background:#1F2926;border:1px solid #1F2926;color:#F4F7F4;border-radius:8px}
.link{background:transparent;border:0;padding:0;color:#56635E;font-size:12px}
.row{display:grid;grid-template-columns:28px 1fr 56px;column-gap:10px;padding:10px 0;border-bottom:1px solid rgba(31,41,38,0.12);align-items:start}
.tab{background:transparent;border:0;padding:8px 0 10px;color:#6F7C76;font-size:13px;flex:1;border-bottom:1px solid transparent}
.bar{background:transparent;border:0;padding:0;color:#6F7C76;font-size:12px;flex:1;height:44px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 15px; line-height: 1.5; color: #1F2926; background: #E8EEEA">

  <svg aria-hidden="true" viewBox="0 0 390 200" preserveAspectRatio="none" style="position: absolute; left: 0; top: 200px; width: 390px; height: 200px; opacity: 0.6">
    <path d="M0 150 C60 110 110 100 170 125 C230 150 280 90 340 115 C370 125 385 120 390 125 L390 200 L0 200 Z" fill="#D5E0DA"></path>
  </svg>

  <header style="height: 92px; box-sizing: border-box; padding: 48px 16px 0; display: flex; align-items: center; gap: 8px; position: relative; z-index: 1">
    <span aria-hidden="true" style="width: 12px; height: 12px; background: #A8322A; border-radius: 2px; display: inline-block"></span>
    <span style="font-size: 15px">Chloe</span>
    <span style="font-size: 12px; color: #56635E">仅你可见</span>
    <span style="flex: 1"></span>
    <button type="button" class="quiet" style="height: 32px; padding: 0 10px; font-size: 12px; color: #1F2926; border-color: #1F2926">案头</button>
  </header>

  <div style="flex: 1; min-height: 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1">
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <p style="margin: 0; max-width: 300px; padding: 8px 12px; background: #F4F7F4; border: 1px solid rgba(31,41,38,0.12); border-radius: 10px; font-size: 15px">第三集的钩子太软了。船家得在岸边加价。</p>
      <span style="font-size: 11px; color: #56635E"><span class="num">14:03</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; color: #56635E">Chloe</span>
      <p style="margin: 0; font-size: 15px">改了。船家在岸边把价翻倍，少年数了数，银子只够一个人过江。</p>
      <div style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid rgba(31,41,38,0.26); border-radius: 8px; font-size: 12px; color: #56635E; align-self: flex-start">
        <span class="stamp" aria-hidden="true">改</span>
        <span>改了 1 处　第 3 集 · 钩子</span>
        <a href="#sheet" style="color: #1F2926">看</a>
      </div>
    </div>
  </div>

  <section id="sheet" aria-label="案头" style="height: 430px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; background: rgba(243,247,244,0.86); backdrop-filter: blur(16px) saturate(1.5); border-top: 1px solid rgba(31,41,38,0.12); border-radius: 14px 14px 0 0; position: relative; z-index: 2; box-shadow: 0 -8px 24px rgba(36,60,52,0.10)">
    <button type="button" aria-label="拖动调整案头高度" style="display: block; width: 36px; height: 4px; margin: 8px auto 0; border: 0; border-radius: 2px; background: rgba(31,41,38,0.26); padding: 0"></button>
    <div style="padding: 6px 16px 0; display: flex; align-items: baseline; gap: 10px">
      <span style="font-size: 12px; color: #56635E">案头</span>
      <span style="font-size: 18px">《春山》</span>
      <span style="flex: 1"></span>
      <a href="#studio" style="font-size: 12px">工作室</a>
    </div>
    <nav role="tablist" aria-label="创作阶段" style="display: flex; margin: 4px 16px 0; border-bottom: 1px solid rgba(31,41,38,0.12)">
      <button type="button" role="tab" aria-selected="false" class="tab" style="color: #56635E">立意</button>
      <button type="button" role="tab" aria-selected="false" class="tab" style="color: #56635E">章回</button>
      <button type="button" role="tab" aria-selected="true" class="tab" style="color: #1F2926; border-bottom-color: #A8322A">分集</button>
      <button type="button" role="tab" aria-selected="false" class="tab">分镜</button>
      <button type="button" role="tab" aria-selected="false" class="tab">成片</button>
    </nav>

    <div role="list" aria-label="分集" style="flex: 1; min-height: 0; padding: 0 16px; overflow: hidden">
      <div role="listitem" class="row">
        <span aria-hidden="true" style="font-size: 18px; line-height: 1.3; color: #6F7C76">一</span>
        <div style="min-width: 0">
          <p style="margin: 0; font-size: 15px">雾里渡口</p>
          <p style="margin: 1px 0 0; font-size: 12px; color: #56635E">钩子：船家只肯再走一趟。</p>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px"><span class="num" style="font-size: 11px; color: #56635E">1′30″</span><span class="stamp" role="img" aria-label="已定稿">定</span></div>
      </div>
      <div role="listitem" class="row">
        <span aria-hidden="true" style="font-size: 18px; line-height: 1.3; color: #6F7C76">二</span>
        <div style="min-width: 0">
          <p style="margin: 0; font-size: 15px">回望北岸</p>
          <p style="margin: 1px 0 0; font-size: 12px; color: #56635E">钩子：岸上有人喊他的名字。</p>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px"><span class="num" style="font-size: 11px; color: #56635E">1′20″</span><span class="stamp" role="img" aria-label="已定稿">定</span></div>
      </div>
      <div role="listitem" class="row" style="background: rgba(244,247,244,0.8); margin: 0 -16px; padding-left: 16px; padding-right: 16px">
        <span aria-hidden="true" style="font-size: 18px; line-height: 1.3; color: #6F7C76">三</span>
        <div style="min-width: 0">
          <p style="margin: 0; font-size: 15px">船家的价</p>
          <p style="margin: 1px 0 0; font-size: 12px; display: inline; border-bottom: 1px solid #A8322A; padding-bottom: 1px">钩子：船家把价翻倍，银子只够一个人过江。</p>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span class="num" style="font-size: 11px; color: #56635E">1′40″</span><span style="font-size: 11px; color: #A8322A; white-space: nowrap">改 <span class="num">14:03</span></span></div>
      </div>
      <div role="listitem" class="row" style="border-bottom: 0">
        <span aria-hidden="true" style="font-size: 18px; line-height: 1.3; color: #6F7C76">四</span>
        <div style="min-width: 0">
          <p style="margin: 0; font-size: 15px">一个人过江</p>
          <label for="hook-4" style="display: block; margin-top: 4px; font-size: 11px; color: #56635E">钩子</label>
          <textarea id="hook-4" rows="2" style="display: block; width: 100%; box-sizing: border-box; margin-top: 2px; padding: 6px 8px; border: 1px solid #1F2926; border-radius: 6px; background: #F4F7F4; font-size: 13px; line-height: 1.5; color: #1F2926; resize: none">江心回头，北岸起了火光。</textarea>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px">
            <span style="font-size: 11px; color: #6F7C76">自动保存</span>
            <span style="flex: 1"></span>
            <button type="button" class="link">问分身</button>
            <button type="button" class="link">拆成两集</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span class="num" style="font-size: 11px; color: #56635E">1′50″</span></div>
      </div>
    </div>

    <div style="padding: 10px 16px 12px; border-top: 1px solid rgba(31,41,38,0.12); display: flex; align-items: center; gap: 10px">
      <p style="margin: 0; font-size: 12px; min-width: 0">第二批拆解　第 5 到 8 集　<span class="num">4.20</span> 元</p>
      <span style="flex: 1"></span>
      <button type="button" class="ink" style="height: 36px; padding: 0 12px; font-size: 13px">确认拆解</button>
    </div>
  </section>

  <div style="height: 50px; flex: none; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 3; background: rgba(248,251,249,0.92); border-top: 1px solid rgba(31,41,38,0.12)">
    <label for="composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">说点什么</label>
    <textarea id="composer" rows="1" placeholder="接着说…" style="flex: 1; min-width: 0; box-sizing: border-box; resize: none; border: 1px solid rgba(31,41,38,0.12); border-radius: 8px; background: #F4F7F4; outline: none; font-size: 15px; line-height: 1.4; color: #1F2926; padding: 7px 10px; height: 36px"></textarea>
    <button type="button" aria-label="语音" class="quiet" style="height: 36px; width: 36px; font-size: 12px">声</button>
    <button type="button" class="ink" style="height: 36px; padding: 0 12px; font-size: 13px">发送</button>
  </div>

  <nav aria-label="底部导航" style="height: 44px; flex: none; display: flex; align-items: stretch; background: #F4F7F4; border-top: 1px solid rgba(31,41,38,0.12); position: relative; z-index: 3">
    <button type="button" class="bar" style="color: #1F2926; box-shadow: inset 0 2px 0 #A8322A">对话</button>
    <button type="button" class="bar">分身</button>
    <button type="button" class="bar">广场</button>
    <button type="button" class="bar">书斋</button>
    <button type="button" class="bar">设置</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
