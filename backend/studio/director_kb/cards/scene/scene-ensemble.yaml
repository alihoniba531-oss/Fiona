  - {name: 剪辑理论与平行剪辑, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/editing-theory.md}
  - {name: 镜头语言与群像调度, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/camera.md}
  - {name: 构图与多人站位, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/composition.md}
