id: scene-confrontation
type: scene
title: 争执对峙
summary: 2 人或小群体围绕不相容要求互相施压，用距离、高低位和语气升级逼出选择。
tags: [confrontation, conflict, standoff, two-person, dialogue-driven]
sources:
