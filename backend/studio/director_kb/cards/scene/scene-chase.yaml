  - {name: 镜头语言与跟拍, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/camera.md}
  - {name: 声音设计与空间混响, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/sound-design.md}
