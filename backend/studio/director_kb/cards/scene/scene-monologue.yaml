id: scene-monologue
type: scene
title: 情感独白 / 内心戏
summary: 单个角色用言语、停顿和微动作说出内心判断，外部回应不是推进主力。
tags: [monologue, inner-thought, solo, emotional, voiceover]
sources:
  - {name: 作者规则、P01 约 3.9 秒/镜与生成下限（经验值，待作者成片统计校准）, license: own, ref: docs/tasks/2026-10-18-studio-wo3e-director-kb/00-house-rules.md}
  - {name: 分集拆镜规范, license: own, ref: ~/Desktop/视频生成/.claude/skills/shortfilm-pipeline/references/02-分集拆镜.md}
  - {name: 声画时间轴规范, license: own, ref: ~/Desktop/视频生成/.claude/skills/shortfilm-pipeline/references/05-声画时间轴.md}
  - {name: 台词停顿与留白, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/dialogue-rhythm.md}
  - {name: 微表情与眼神变化, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/micro-expressions.md}
  - {name: 身体语言与姿态, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/body-language.md}
  - {name: 视觉潜台词与意识流, license: MIT, ref: ~/.claude/skills/ai-visual-director/knowledge/visual-subtext.md}
