id: scene-cliffhanger
type: scene
title: 结尾悬念
summary: 叠加在内容卡上的位置卡，在高风险结果出现前截断，把选择与威胁留到下一段。
tags: [ending, cliffhanger, suspense, position-card, cutaway]
sources:
