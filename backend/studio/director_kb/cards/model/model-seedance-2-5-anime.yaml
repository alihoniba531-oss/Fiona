id: model-seedance-2-5-anime
type: model
title: Seedance 2.5 动漫
summary: Seedance 2.5 动漫通道的规格、风格约束、版权拦截、运镜风险和提示词语法。
tags: [seedance, seedance-2-5, anime, video, first-frame, reference-images]
sources:
  - {name: 作者规则与 P01 实测, license: own, ref: docs/tasks/2026-10-18-studio-wo3e-director-kb/00-house-rules.md}
  - {name: seedance-shot-design 官方规范整理, license: MIT-0, ref: references/seedance-specs.md}
  - {name: seedance-shot-design 官方示例, license: MIT-0, ref: references/official-examples.md}
  - {name: seedance-shot-design 失败诊断, license: MIT-0, ref: references/failure-diagnosis.md}
  - {name: 逐集生产规范, license: own, ref: ~/Desktop/视频生成/.claude/skills/shortfilm-pipeline/references/03-逐集生产.md}
  - {name: 接口速查, license: own, ref: ~/Desktop/视频生成/.claude/skills/shortfilm-pipeline/references/04-接口速查.md}
version: 1
model: seedance-2.5
style: anime
facts:
  - 时长档位：标准生成 4–30 秒；超长视频 30–180 秒；延长源不超过 30 秒，新增 4–30 秒，结果不超过 60 秒（官方）
  - duration=-1 可能表示平台自动时长；要求精确长度时不要假定（官方）
  - 分辨率：官方手册参数为 480p 与 720p，不能据此手册声称官方支持 1080p（官方）
  - MCP 通道额外提供 1080p；《侠客行》8 条 1080p 任务输出 1920×1080、24fps（实测）
  - 480p 横幅输出 852×480、24fps（实测）
  - 帧率：24fps（实测）
  - 素材上限：图片 30 张、视频 10 段、音频 10 段；2.5 手册没有 12 个文件的混合上限（官方）
  - 参考稳定性：图像不同主体 1–8 个较稳，9–12 个需要更多次；视频或音频主体 1–5 个较稳，6–10 个需要更多次（官方）
  - 原生音频：支持音画联合（官方）
  - MCP 里 generate_audio 的默认值可能已经打开，工作室提交时改传 false（实测）
  - 首帧模式不要发送 camera_fixed，实测返回 HTTP 400；固定机位写进视频提示词（实测）
  - 提示词上限：MCP 参数校验 2000 字符；官方手册未给字符上限（官方）
  - 参考价：720p 约 2–2.6 元/秒，1080p 约 3.4 元/秒（实测参考价，以 list_video_models 为准）
portrait_gate: 无（动漫风格不涉及真人肖像首帧，§11 来源未见同类固定拦截）；平台内容审核与版权规则仍适用。
copyright: 形象近似知名 IP 时，常常要等生成完成后才被拦，不计费但白等约 6 分钟（作者实测）。对策：不点名 IP 角色，不复刻标志性发型、服装与道具组合，先做美术方向差异化；过肩背影只露出标志性头饰也可能被拦。
motion_risks:
  - 跟拍或拉远会把画外区域带进画面，只露局部的巨物容易被编成别的生物并缩小体型（作者实测）
  - 环绕会让模型补出不存在的结构连接，P01 出现丝杠穿进滚柱（作者实测）
  - 下移镜头会让材质漂移，P01 的金属屑变成木刨花（作者实测）
  - 动漫发丝、衣摆和披风在环绕或快速跟拍中容易穿模和跳变；这些部位成为重点时改固定机位
  - 多人同框时武器容易换手，同框压到 2 人，群战拆成 2 人段和 1 人反应段（作者规则）
  - 写实皮肤、毛孔、实拍质感等词混入，会让线条、上色和阴影跳变
prompt_syntax:
  - 时间戳用有序区间，例如 [00.0-05.0s]、0-5秒、0:30-0:45；把动作、对白、音效和转场绑到明确区间（官方）
  - 官方示例支持帧锚点；只有提示词或制作说明已确定 24fps 时才按 24fps 换算（官方）
  - 复杂 30 秒按“多模态参考层 → 全局设定 → 时间戳剧本 → 全局连续性与负向约束”组织（官方）
  - 素材令牌照界面原样写 @图片1、@视频1、@音频1，不要自行改编号（官方）
  - 写明线条、上色与阴影层级；不要混入 photoreal、皮肤毛孔、实拍质感等写实真人词
  - Seedance 2.0 与 2.5 的时间戳写法相反（作者规则）；2.0 的具体格式在 §11 来源中查不到，待作者实测核实，不能按 2.5 的区间格式反推
  - 首帧模式不发送 camera_fixed，实测返回 HTTP 400；固定机位写进视频提示词
  - 提示词控制在 2000 字符内；先删重复形容词和静态外观，只留动作、运镜和连续性（实测）
max_characters: 2
lint_rules:
  - id: seedance-anime-photoreal-words
    pattern: '(?i)(photorealistic|photoreal|真人写实|皮肤毛孔|实拍质感|写实皮肤)'
    level: warn
    message: '动漫卡里出现写实真人词会让线条和上色跳变；改用动漫线条、上色和阴影层级词。'
  - id: seedance-anime-camera-fixed
    pattern: '(?i)camera_fixed\s*[:=]\s*true'
    level: warn
    message: 'Seedance 2.5 首帧模式不要发送 camera_fixed，实测会返回 HTTP 400；固定机位写进视频提示词。'
  - id: seedance-anime-2-0-timestamp
    pattern: '(?i)(seedance\s*2\.0|seedance20)'
    level: warn
    message: 'Seedance 2.0 的时间戳格式未在 §11 来源核实，不能按 2.5 的区间写法写成定论；待作者实测核实。'
  - id: seedance-anime-prompt-too-long
    pattern: '(?s)^.{2001,}$'
    level: warn
    message: '提示词超过 2000 字符，MCP 可能拒收；先删重复形容词和静态外观，只留动作、运镜和连续性。'
  - id: seedance-anime-crowd
    pattern: '(?i)(3\s*人同框|4\s*人同框|群战|混战|群像)'
    level: info
    message: '同框超过 2 人时身份、手脚和兵器容易串位；拆成 2 人段和 1 人反应段，再在剪辑里重建空间。'
