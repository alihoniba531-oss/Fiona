version: 1
wrong: 镜头从桌面样件缓慢推近，然后上摇到工程师的脸。
right: 固定机位，保持首帧俯视构图。画面只留桌面、图纸、样件和工程师的手与前臂，头脸始终在画外。
why: 上摇进入首帧没有的区域，模型只能临场编；在不露脸的项目里，就会冒出一张 AI 脸。要交代人物，另起 1 个设计好的固定镜头。
