<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>菲欧娜</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading">加载菲欧娜中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>

  <div id="err" hidden>
    <h2>无法连接到云端</h2>
    <p class="reason" id="reason">SSH 隧道未建立或云端 3000 端口未就绪。</p>
    <pre id="diag">收集诊断中…</pre>
    <div>
      <button id="retry-btn" class="btn btn-primary">重试</button>
      <button id="open-logs-btn" class="btn">打开日志目录</button>
    </div>
    <div class="hint">日志目录里 <code>ssh.log</code> 是 SSH 详细输出，<code>startup.log</code> 是整体启动摘要。</div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
