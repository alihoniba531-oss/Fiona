name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-desktop.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install npm deps
        run: npm install

      - name: Tauri build (.msi)
        run: npm run build

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiona-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload .exe artifact (NSIS, 备用)
        uses: actions/upload-artifact@v4
        with:
          name: fiona-desktop-exe
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
